<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Cursor 模型编辑参考</title><style>:root{color-scheme:dark;font:14px system-ui;background:#222;color:#eee}main{max-width:720px;margin:32px auto;padding:24px;background:#303033;border-radius:16px}input,button{font:inherit;color:inherit;background:#222;border:1px solid #555;padding:12px;border-radius:8px}button{cursor:pointer}.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.model{border:1px solid #555;border-radius:14px;padding:12px;margin:16px 0}.model input{min-width:0;flex:1}p{color:#aaa;line-height:1.7}.empty{padding:24px;border:1px dashed #555;border-radius:14px;text-align:center}dialog{color:inherit;background:#303033;border:1px solid #555;border-radius:16px;padding:24px;width:min(500px,80vw)}dialog::backdrop{background:#0008}</style><main><h2>Cursor 配置</h2><p>离线交互参考，不连接账号；示例模型仅为占位。</p><label>API 密钥</label><p><input type="password" disabled placeholder="留空保留已有密钥"></p><div class="row"><h3>模型目录</h3><button onclick="picker.showModal()">获取可用模型</button></div><section id="models"><p class="empty">模型选择器中将不显示任何模型；目录外 ID 仍需通过账号目录校验。</p></section><button onclick="add()">＋ 添加模型</button><p>上下文窗口仅控制 DSH 预算，留空沿用提供商配置，否则未知。最大输出 token：SDK 未提供控制入口。图片：通过 SDK 发送；具体模型视觉能力由 Cursor 决定。</p><fieldset id="input-types"><legend>输入类型</legend><label><input type="checkbox" checked onchange="guard(this)">文字</label><label><input type="checkbox" checked onchange="guard(this)">图片</label></fieldset><p>至少保留一种输入类型。未勾选图片时由 DSH 转换为文字占位。既有未声明的模型保持原行为，修改勾选后保存为显式声明。</p><button>保存配置</button><script>function guard(el){const boxes=[...document.querySelectorAll('#input-types input')];if(!boxes.some(b=>b.checked))el.checked=true;boxes.forEach(b=>b.disabled=b.checked&&boxes.filter(x=>x.checked).length===1)}</script></main><dialog id="picker"><h2>选择要添加的模型</h2><p>勾选要添加的模型（离线示例）。</p><input placeholder="搜索模型"><p><label><input id="chosen" type="checkbox"> 示例模型（非账号数据）</label></p><div class="row"><button onclick="picker.close()">取消</button><button onclick="if(chosen.checked)add('example-model');picker.close()">添加所选</button></div></dialog><script>function add(id=''){if(document.querySelector('.empty'))models.innerHTML='';const el=document.createElement('div');el.className='model';el.innerHTML='<div class="row"><input placeholder="模型 ID" value="'+id+'"><input placeholder="显示名称"><button onclick="this.closest(\'.model\').remove()">删除</button></div><details><summary>高级设置</summary><p>上下文窗口（DSH 预算）</p><input type="number" placeholder="默认 / 未知"><p>最大输出 token 数：SDK 不支持指定</p><label><input type="checkbox" checked disabled>文本</label> <label><input type="checkbox" disabled>图片（暂不支持）</label></details>';models.append(el)}</script></html>
